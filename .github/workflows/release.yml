name: Release

# Push a tag like "v1.2.3" to build the package, publish it to PyPI
# and create a matching GitHub release with the built files attached.
# The tag must match the version in pyproject.toml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject.toml version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-exe:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --onefile --windowed \
            --add-data fitbrowser/fitbrowser.css:fitbrowser \
            --add-data fitbrowser/activity.js:fitbrowser \
            --add-data fitbrowser/overview.js:fitbrowser \
            fitbrowser.py
          mkdir exe
          mv dist/fitbrowser.exe "exe/fitbrowser-${GITHUB_REF_NAME}-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: exe/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, build-exe]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fitbrowser/
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: exe/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* exe/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
